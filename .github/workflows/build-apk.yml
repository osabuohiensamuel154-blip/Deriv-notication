name: Build Deriv Notify APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DerivNotify/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Android platform & build tools
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT

      - name: Install app dependencies
        working-directory: DerivNotify
        run: npm ci

      - name: Install React Native CLI (needed for bundling)
        working-directory: DerivNotify
        run: npm install --no-save @react-native-community/cli@latest

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Prebuild Expo (generate Android project)
        working-directory: DerivNotify
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Create assets directory
        working-directory: DerivNotify
        run: mkdir -p android/app/src/main/assets

      # Bundle JS manually so the APK runs standalone — no Metro server needed
      - name: Bundle JavaScript into APK assets
        working-directory: DerivNotify
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: 1

      - name: Make Gradle executable
        working-directory: DerivNotify/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('DerivNotify/android/**/*.gradle*', 'DerivNotify/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Skip Gradle's own bundling task — JS is already in assets from above
      - name: Build standalone Debug APK
        working-directory: DerivNotify/android
        run: |
          ./gradlew assembleDebug \
            -x bundleDebugJsAndAssets \
            -x createBundleDebugJsAndAssets \
            --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: |
          mkdir -p output
          cp DerivNotify/android/app/build/outputs/apk/debug/app-debug.apk \
             output/deriv-price-alerts.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deriv-price-alerts-apk
          path: output/deriv-price-alerts.apk
          retention-days: 30

      - name: Show APK info
        run: |
          echo "✅ Standalone APK ready — no Metro server needed"
          ls -lh output/deriv-price-alerts.apk
